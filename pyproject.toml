[project]
name = "iampathfinder"
version = "0.1.0"
description = "Offline AWS IAM privilege-escalation path finder (policy evaluator + graph search)"
requires-python = ">=3.9"
[project.scripts]
iampathfinder = "iampathfinder.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
